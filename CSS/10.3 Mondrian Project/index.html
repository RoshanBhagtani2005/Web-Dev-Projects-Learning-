<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .container {
      height: 748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px, 198px, 153px, 50px;
      grid-template-rows: 414px, 130px, 155px, 20px;
      gap: 10px;
      
    }
    .item{
      background-color: #F0F1EC;
    }

    .red {
      width: 320px;
      height: 414px;

      background-color: #E72F24;
      

    }

    .yellow {
      width: 198px;
      background-color: #F9D01E;
      grid-column-start: 2;
      grid-row-start: 8;
    }

    .black {
      width: 153px;
      background-color: #232629;
      grid-column-start: 3;
      grid-row-start: 8;
    }

    .blue {
      width: 50px;
      height: 130px;
      background-color: #004592;
      grid-row-start: 2;
      grid-row-end: 4;
      grid-column-start: 4;
      grid-column-end: 4;
    }
  </style>
</head>

<body>
  <div class="container item">
    <div class="red"></div>
    <div class="yellow"></div>
    <div class="black"></div>
    <div class="blue"></div>

  </div>
</body>

</html>
